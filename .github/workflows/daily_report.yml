name: Run Daily DTC Report (18:19 ICT)

on:
  schedule:
    # 18:19 ICT (UTC+7) = 11:19 UTC
    - cron: '19 11 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date in Bangkok (YYYY-MM-DD)'
        required: true
        type: string
      check_only:
        description: 'Check the report date only (no GPS login or email)'
        required: true
        type: boolean
        default: true

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Automation Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
          DTC_USERNAME: ${{ secrets.DTC_USERNAME }}
          DTC_PASSWORD: ${{ secrets.DTC_PASSWORD }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            node index.js --check-report-date
          else
            node index.js
          fi

      - name: Upload Artifacts (Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-reports
          path: downloads/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            downloads/*.png
            *.png
          if-no-files-found: ignore
          retention-days: 1
